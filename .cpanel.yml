---
# cPanel Git Version Control runs these when you click "Deploy HEAD Commit".
# server/deploy.sh copies the website (public/) into the domain's folder and adds
# the rules from server/htaccess. It never deletes files, so nothing outside the
# game can be touched.
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/whosthatceleb.com"
    - /bin/bash server/deploy.sh "$DEPLOYPATH"
